name: Release

# Builds something people can install, either way round:
#
#     git tag v0.2.0 && git push origin v0.2.0     # tag first
#     …or run this workflow from a branch          # tag made here
#
# The tag comes from `tauri.conf.json` in the second case, so a release is
# always named after the version it actually contains.
#
# It leaves a *draft* release with the installers and the command-line tools
# attached. A person writes the notes and presses publish, because a build
# succeeding is not the same as a release being ready.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the draft that is already built, instead of building'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # A tag that disagrees with the version in the bundle produces installers
  # that lie about what they are, and nothing downstream would notice.
  check-version:
    name: The tag matches the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        run: |
          configured=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          echo "version=$configured" >> "$GITHUB_OUTPUT"
          # Only a tag can disagree. Run from a branch and the tag is made
          # from this number, so there is nothing to disagree with.
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$configured" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match tauri.conf.json version $configured."
            echo "::error::Set the version in apps/desktop/{package.json,src-tauri/Cargo.toml,src-tauri/tauri.conf.json} and re-tag."
            exit 1
          fi
          echo "building v$configured"

  # Eight build jobs upload to one release. If each of them is allowed to
  # create-it-if-missing, several will decide it is missing at the same
  # moment and GitHub will happily keep every draft they make. So the draft
  # is made once, here — along with the tag, when there is not one yet — and
  # the builders only ever attach to it.
  draft:
    name: Open the draft
    needs: check-version
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: HyperLab v${{ needs.check-version.outputs.version }}
          draft: true
          prerelease: false
          body: |
            Install the file for your platform below. Nothing phones home,
            and HyperLab works with no AI provider configured.

            What is in this release, and what is not:
            [CHANGELOG.md](https://github.com/JGalego/HyperLab/blob/v${{ needs.check-version.outputs.version }}/CHANGELOG.md).

  desktop:
    name: ${{ matrix.name }}
    needs: [check-version, draft]
    if: ${{ !inputs.publish }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal, so one download covers Apple Silicon and Intel.
          - os: macos-latest
            name: macOS (universal)
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            name: Windows
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
          # Not `ubuntu-latest`: a bundle built against a newer glibc will
          # not start on an older distribution, and the runner keeps moving.
          - os: ubuntu-22.04
            name: Linux
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Tauri's system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
        working-directory: apps/desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          # The draft already exists; matching the tag attaches to it
          # rather than opening a second one.
          tagName: v${{ needs.check-version.outputs.version }}
          releaseName: HyperLab v${{ needs.check-version.outputs.version }}
          releaseDraft: true
          prerelease: false

  # `hyperlab-mcp` is how you plug a stack into Claude Desktop or any other
  # MCP client, and `hyperlab-graph` draws one. Neither needs a window, so
  # they ship as plain executables next to the installers.
  tools:
    name: Command-line tools (${{ matrix.name }})
    needs: [check-version, draft]
    if: ${{ !inputs.publish }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The five that `install.sh` and `install.ps1` know how to ask for.
        # A platform missing here is a platform whose install one-liner
        # stops with "no build for this yet", which is at least honest.
        #
        # Every one names its target explicitly, even where it is the host's
        # own, so the binaries are always at target/<triple>/release and the
        # gather step below does not need to know which case it is in.
        include:
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            suffix: ''
          # Cross-compiled from the arm64 runner rather than built on an Intel
          # one: `macos-13` is retired, and a job asking for it waits for a
          # runner that is never coming. Both are Darwin with the same SDK, so
          # this is the ordinary supported cross, not a trick.
          - os: macos-latest
            name: macos-x64
            target: x86_64-apple-darwin
            suffix: ''
          - os: windows-latest
            name: windows-x64
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
          - os: ubuntu-22.04
            name: linux-x64
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: ubuntu-22.04-arm
            name: linux-arm64
            target: aarch64-unknown-linux-gnu
            suffix: ''

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # `shell: bash` because the default on Windows is PowerShell, where a
      # trailing backslash is not a line continuation: it read `--bin` as a
      # new statement and failed with "missing expression after unary
      # operator". Every other step here that spans lines already says this.
      - name: Build
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --bin hyperlab-mcp --bin hyperlab-graph

      - name: Gather
        shell: bash
        run: |
          mkdir -p dist
          for tool in hyperlab-mcp hyperlab-graph; do
            cp "target/${{ matrix.target }}/release/$tool${{ matrix.suffix }}" \
               "dist/$tool-${{ matrix.name }}${{ matrix.suffix }}"
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          draft: true
          files: dist/*

  # The last step, and the only one that makes anything public. Kept apart
  # from the builds because by the time it is worth doing they have already
  # run: this attaches no files and rebuilds nothing, it just takes the draft
  # off the shelf. Someone has to ask for it, which is the point — a build
  # succeeding is not the same as a release being ready.
  publish:
    name: Publish the draft
    needs: check-version
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: HyperLab v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false
          # Written out again rather than left off, so publishing cannot
          # depend on what the draft job happened to put there.
          body: |
            Install the file for your platform below. Nothing phones home,
            and HyperLab works with no AI provider configured.

            What is in this release, and what is not:
            [CHANGELOG.md](https://github.com/JGalego/HyperLab/blob/v${{ needs.check-version.outputs.version }}/CHANGELOG.md).
