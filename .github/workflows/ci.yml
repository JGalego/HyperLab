name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    # The core crates need no GUI toolchain, which is the point of keeping the
    # desktop shell out of the workspace: this job is fast and runs everywhere.
    name: Core crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Graphviz
        # `hyperlab-graph` writes DOT, and the only honest check that what it
        # writes is valid DOT is to hand it to the program that reads it.
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: The examples are still what the generator produces
        run: |
          cargo run -p hyperlab-persistence --example build_examples
          # metadata.json records when the save happened, so it is expected
          # to differ; everything else must be byte-identical.
          git diff --exit-code -- examples/ ':(exclude)examples/**/metadata.json' || {
            echo "::error::examples/ is out of date. Run:"
            echo "  cargo run -p hyperlab-persistence --example build_examples"
            exit 1
          }

  audit:
    # A dependency with a published advisory is a bug that arrived without
    # anyone touching the code, so it has to be checked on a schedule rather
    # than noticed. `apps/desktop/src-tauri/.cargo/audit.toml` says what is
    # deliberately passed over, and why.
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A prebuilt binary. Building cargo-audit from source takes five
      # minutes, every run, to answer a question that takes two seconds.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Core crates
        run: cargo audit
      - name: Desktop shell
        working-directory: apps/desktop/src-tauri
        run: cargo audit

  frontend:
    name: Desktop frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vite build

  desktop:
    name: Desktop shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Tauri's system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build the frontend the shell embeds
        working-directory: apps/desktop
        run: |
          npm ci
          npx vite build

      - name: Check the shell
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets

      # The shell has tests of its own — settings, the view model, the
      # window's security policy — and being outside the main workspace
      # meant none of them had ever run here.
      - name: Test the shell
        working-directory: apps/desktop/src-tauri
        run: cargo test
