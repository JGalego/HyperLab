name: Move a tag

# A one-off repair, and expected to be deleted once it has run.
#
# v0.2.0 was published from a draft with no `target_commitish`, so GitHub put
# the tag on the default branch rather than on the commit that was built.
# Nothing outside a workflow can move a tag in this repository, so this does
# it — and refuses unless the commit really is the version the tag claims,
# and really is on the default branch.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to move (e.g. v0.2.0)'
        required: true
      sha:
        description: 'Commit it should point at'
        required: true

permissions:
  contents: write

jobs:
  move:
    name: Move ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          # The whole history, so the ancestry check below has something to
          # check against.
          fetch-depth: 0

      - name: The commit is the version the tag claims
        run: |
          configured=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "${{ inputs.tag }}" != "v$configured" ]; then
            echo "::error::${{ inputs.sha }} is version $configured, not ${{ inputs.tag }}."
            exit 1
          fi

      - name: The commit is on ${{ github.event.repository.default_branch }}
        run: |
          branch="${{ github.event.repository.default_branch }}"
          git fetch --quiet origin "$branch"
          if ! git merge-base --is-ancestor "${{ inputs.sha }}" "origin/$branch"; then
            echo "::error::${{ inputs.sha }} is not on $branch; a tag there would dangle."
            exit 1
          fi

      - name: Move it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
            "repos/${{ github.repository }}/git/refs/tags/${{ inputs.tag }}" \
            -f sha='${{ inputs.sha }}' -F force=true
