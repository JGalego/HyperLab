name: Delete a branch

# A one-off, and expected to be deleted once it has run. The git relay this
# repository is reached through refuses ref deletions, so a stale branch
# cannot be removed from outside a workflow.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to delete'
        required: true

permissions:
  contents: write

jobs:
  prune:
    name: Delete ${{ inputs.branch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: It is not the default branch
        run: |
          if [ "${{ inputs.branch }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::that is the default branch."
            exit 1
          fi

      - name: Nothing on it would be lost
        run: |
          branch="${{ inputs.branch }}"
          default="${{ github.event.repository.default_branch }}"
          git fetch --quiet origin "$branch" "$default"
          # Its content has to be somewhere in the default branch already.
          # Ancestry is the usual test and is no use here: the history was
          # reauthored, so the same trees live under different commit ids.
          tree=$(git rev-parse "origin/$branch^{tree}")
          if git log --format='%T' "origin/$default" | grep -qx "$tree"; then
            echo "$branch is at a tree the default branch already has."
          else
            echo "::error::$branch has content that is not on $default."
            exit 1
          fi

      - name: Delete it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/git/refs/heads/${{ inputs.branch }}"
