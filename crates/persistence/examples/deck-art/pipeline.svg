<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 200" width="592" height="200">
  <title>Text goes in, one token comes out, and the whole thing runs again</title>
  <defs>
    <pattern id="d50" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#fff"/>
      <rect width="2" height="2"/><rect x="2" y="2" width="2" height="2"/>
    </pattern>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">
    <g fill="#fff" stroke="#000" stroke-width="2.5">
      <rect x="24" y="30" width="104" height="80"/>
      <rect x="222" y="24" width="148" height="92" fill="url(#d50)"/>
      <rect x="462" y="30" width="106" height="80"/>
    </g>
    <g stroke="#000" stroke-width="2.5" fill="none">
      <path d="M136 70 h78" marker-end="url(#tip)"/>
      <path d="M378 70 h76" marker-end="url(#tip)"/>
      <path d="M42 46 h68 M42 60 h68 M42 74 h44"/>
    </g>
    <rect x="246" y="57" width="100" height="26" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="296" y="75">the model</text>

    <rect x="480" y="56" width="70" height="28" fill="#000"/>
    <text x="515" y="76" fill="#fff" font-size="15">mat</text>

    <text x="76" y="132">what you sent</text>
    <text x="296" y="140">a score for every token it knows</text>
    <text x="515" y="132">one token</text>

    <g stroke="#000" stroke-width="2.5" fill="none">
      <path d="M515 150 v22 H76 v-24" marker-end="url(#tip)"/>
    </g>
    <text x="296" y="188" font-style="italic">stuck on the end, and the whole thing runs again</text>
  </g>
</svg>
