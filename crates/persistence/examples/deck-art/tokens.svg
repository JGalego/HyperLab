<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 200" width="592" height="200">
  <title>Two words, chopped into the pieces a model actually sees</title>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">
    <g fill="#fff" stroke="#000" stroke-width="2.5">
      <rect x="40" y="30" width="52" height="34"/>
      <rect x="92" y="30" width="62" height="34"/>
      <rect x="154" y="30" width="66" height="34"/>
      <rect x="220" y="30" width="76" height="34"/>
    </g>
    <g fill="#000">
      <text x="66" y="53">un</text>
      <text x="123" y="53">bel</text>
      <text x="187" y="53">iev</text>
      <text x="258" y="53">able</text>
    </g>
    <g font-size="11" fill="#000">
      <text x="66" y="80">301</text>
      <text x="123" y="80">6789</text>
      <text x="187" y="80">12144</text>
      <text x="258" y="80">1122</text>
    </g>
    <text x="168" y="104" font-size="13" font-style="italic">four pieces, one word</text>

    <g fill="#fff" stroke="#000" stroke-width="2.5">
      <rect x="40" y="126" width="56" height="34"/>
      <rect x="96" y="126" width="50" height="34"/>
      <rect x="146" y="126" width="86" height="34"/>
    </g>
    <g fill="#000">
      <text x="68" y="149">str</text>
      <text x="121" y="149">aw</text>
      <text x="189" y="149">berry</text>
    </g>
    <text x="136" y="184" font-size="13" font-style="italic">three pieces, and not one of them is an “r”</text>

    <g stroke="#000" stroke-width="2.5" fill="none"><path d="M330 24 v152"/></g>
    <g font-size="13" text-anchor="start" fill="#000">
      <text x="354" y="60">Common words are one piece.</text>
      <text x="354" y="84">Rare ones are several.</text>
      <text x="354" y="124">Asking how many r’s are in</text>
      <text x="354" y="146">“strawberry” asks about letters</text>
      <text x="354" y="168">it was never shown.</text>
    </g>
  </g>
</svg>
