<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 200" width="592" height="200">
  <title>The model asks for a tool; a program runs it and hands back the result</title>
  <defs>
    <marker id="tip4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <pattern id="d50x" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#fff"/>
      <rect width="2" height="2"/><rect x="2" y="2" width="2" height="2"/>
    </pattern>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
    <rect x="30" y="66" width="140" height="70" fill="url(#d50x)" stroke="#000" stroke-width="2.5"/>
    <rect x="42" y="88" width="116" height="26" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="100" y="106">the model</text>

    <rect x="422" y="66" width="140" height="70" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="492" y="96">your program</text>
    <text x="492" y="118" font-size="12" font-style="italic">files, network, a stack</text>

    <g stroke="#000" stroke-width="2.5" fill="none">
      <path d="M178 82 h236" marker-end="url(#tip4)"/>
      <path d="M414 122 H178" marker-end="url(#tip4)"/>
    </g>
    <g font-size="13">
      <text x="296" y="74">“call search with these words”</text>
      <text x="296" y="142">the result, as more text</text>
    </g>

    <text x="296" y="176" font-size="13" font-style="italic">round and round until it has an answer</text>
    <text x="296" y="194" font-size="13" font-style="italic">— that is all an agent is</text>
  </g>
</svg>
