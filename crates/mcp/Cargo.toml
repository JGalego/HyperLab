[package]
name = "hyperlab-mcp"
description = "HyperLab's runtime capabilities, exposed as Model Context Protocol tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
hyperlab-ai.workspace = true
# Only the `hyperlab-mcp` binary needs this: a server has to be able to open
# the stack it is serving. Cargo has no way to say "for this binary only", so
# it is declared here rather than in a crate of its own for one `main`.
hyperlab-persistence.workspace = true
hyperlab-runtime.workspace = true
hyperlab-stack.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
