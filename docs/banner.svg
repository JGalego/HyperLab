<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HyperLab: an open-source, AI-native successor to HyperCard">
  <title>HyperLab</title>

  <!-- Neo Classic card, drop shadow and all -->
  <rect x="18" y="18" width="1164" height="224" fill="#8c8c8c"/>
  <rect x="8" y="8" width="1164" height="224" fill="#ffffff" stroke="#000000" stroke-width="4"/>

  <!-- Logo mark: the same stacked cards as the app icon -->
  <g transform="translate(48, 46) scale(1.9)">
    <rect x="32" y="14" width="54" height="66" fill="#ffffff" stroke="#000000" stroke-width="6"/>
    <rect x="10" y="28" width="62" height="66" fill="#ffffff" stroke="#000000" stroke-width="6"/>
    <rect x="20" y="68" width="28" height="16" fill="#000000"/>
  </g>

  <!-- Wordmark -->
  <text x="288" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#000000">HyperLab</text>

  <!-- Tagline -->
  <text x="290" y="160" font-family="'Courier New', Courier, monospace" font-size="22" fill="#000000">An open-source, AI-native successor to HyperCard.</text>

  <line x1="290" y1="178" x2="1128" y2="178" stroke="#000000" stroke-width="2"/>

  <!-- Status line -->
  <text x="290" y="206" font-family="'Courier New', Courier, monospace" font-size="17" fill="#444444">cards &#183; buttons &#183; fields &#183; scripts &#183; language models</text>
</svg>
