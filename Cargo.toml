[workspace]
resolver = "3"
members = ["crates/*"]

# The desktop shell is its own workspace: it depends on Tauri, which needs
# system libraries (webkit2gtk) that are irrelevant to the core crates.
# Keeping it separate means `cargo test` at the repository root always works.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/JGalego/hyperlab"
authors = ["HyperLab contributors"]

[workspace.dependencies]
hyperlab-ai = { path = "crates/ai", version = "0.1.0" }
hyperlab-ai-providers = { path = "crates/ai-providers", version = "0.1.0" }
hyperlab-assistant = { path = "crates/assistant", version = "0.1.0" }
hyperlab-mcp = { path = "crates/mcp", version = "0.1.0" }
hyperlab-parser = { path = "crates/parser", version = "0.1.0" }
hyperlab-persistence = { path = "crates/persistence", version = "0.1.0" }
hyperlab-runtime = { path = "crates/runtime", version = "0.1.0" }
hyperlab-stack = { path = "crates/stack", version = "0.1.0" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
