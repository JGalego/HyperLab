<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 200" width="592" height="200">
  <title>The parts of a prompt, and the one sequence they become</title>
  <defs>
    <marker id="tip3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <pattern id="d50p" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#fff"/>
      <rect width="2" height="2"/><rect x="2" y="2" width="2" height="2"/>
    </pattern>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14">
    <g fill="#fff" stroke="#000" stroke-width="2.5">
      <rect x="30" y="18" width="270" height="34"/>
      <rect x="30" y="58" width="270" height="34"/>
      <rect x="30" y="98" width="270" height="34"/>
      <rect x="30" y="138" width="270" height="34"/>
    </g>
    <g fill="#000" stroke="none">
      <text x="46" y="40">instruction</text>
      <text x="46" y="80">demonstration: input → output</text>
      <text x="46" y="120">the material</text>
      <text x="46" y="160">the query</text>
    </g>
    <g stroke="#000" stroke-width="2.5" fill="none">
      <path d="M308 95 h56" marker-end="url(#tip3)"/>
    </g>
    <rect x="374" y="56" width="120" height="78" fill="url(#d50p)" stroke="#000" stroke-width="2.5"/>
    <rect x="384" y="82" width="100" height="26" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="434" y="100" text-anchor="middle">the model</text>
    <g stroke="#000" stroke-width="2.5" fill="none">
      <path d="M502 95 h26" marker-end="url(#tip3)"/>
      <path d="M548 78 h24 M548 95 h24 M548 112 h14"/>
    </g>
    <g font-size="13" font-style="italic" text-anchor="middle">
      <text x="165" y="192">one sequence; the model sees no seam between them</text>
    </g>
  </g>
</svg>
